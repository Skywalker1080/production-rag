[project]
name = "production-rag"
version = "0.1.0"
description = "Production-grade RAG pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langgraph>=0.6.0",
    "pypdf>=6.17.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/production_rag"]
