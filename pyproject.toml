[project]
name = "production-rag"
version = "0.1.0"
description = "Production-grade RAG pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "charset-normalizer>=3.5.1",
    "fastapi[standard]>=0.141.1",
    "html5lib>=1.1",
    "langgraph>=0.6.0",
    "pypdf>=6.17.0",
    "python-frontmatter>=1.3.0",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14",
    "requests>=2.34.2",
    "unstructured>=0.27.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/production_rag"]


[dependency-groups]
dev = [
    "reportlab>=5.0.1",
]
