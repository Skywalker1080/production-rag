global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "rag-backend"
    static_configs:
      # Backend runs on Windows host via uvicorn :8000.
      # host.docker.internal resolves host from inside Docker Desktop.
      - targets: ["host.docker.internal:8000"]
    metrics_path: "/metrics"

  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: "/metrics"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
